name: waterlily_buoyancy_grid
version: "0.1.0"
description: >
  WaterLily momentum transport and pressure projection with conservative upwind
  scalar transport, coupled Heun time integration, and closed no-slip walls.
  Uses the native CPU SIMD backend and Enzyme reverse-mode differentiation.
build_config:
  package_data:
    - ["./solver.jl", "/opt/waterlily/solver.jl"]
    - ["./vjp.jl", "/opt/waterlily/vjp.jl"]
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates gcc g++ && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.7-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    - 'RUN mkdir -p /app/julia_env /app/julia_depot && printf ''[WaterLily]\nbackend = "SIMD"\n'' > /app/julia_env/LocalPreferences.toml && julia --project=/app/julia_env -e ''using Pkg; Pkg.add([Pkg.PackageSpec(name="WaterLily", version="1.9.2"), Pkg.PackageSpec(name="Enzyme", version="0.13.216"), Pkg.PackageSpec(name="ForwardDiff", version="1.4.6"), Pkg.PackageSpec(name="PythonCall", version="0.9.36")]); Pkg.precompile()'''
    - 'RUN python -c ''import juliacall; juliacall.Main.seval("using WaterLily, Enzyme")'' && chmod -R 777 /app'
env:
  MOSAIC_WATERLILY_SOURCE: "/opt/waterlily"
  JULIA_PROJECT: "/app/julia_env"
  PYTHON_JULIAPKG_PROJECT: "/app/julia_env"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"
  PYTHON_JULIACALL_EXE: "/usr/local/bin/julia"
  PYTHON_JULIACALL_PROJECT: "/app/julia_env"
  JULIA_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  JULIA_NUM_PRECOMPILE_TASKS: "2"
metadata:
  mosaic:
    name: "WaterLily"
    backend: julia
    family: projection
    scheme: "FV + projection"
    discretization: FV
    numerics: "Native momentum fluxes, upwind scalar, Heun, PCG projection"
    ad_strategy: autodiff
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://waterlily-jl.github.io/WaterLily.jl/stable/"
