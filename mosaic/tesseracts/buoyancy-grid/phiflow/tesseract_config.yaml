name: phiflow_buoyancy_grid
version: "0.1.0"
description: >
  Two-dimensional Boussinesq flow with coupled scalar transport, no-slip closed
  walls, semi-Lagrangian advection, explicit diffusion (four substeps), and pressure projection.
build_config:
  base_image: "nvidia/cuda:12.6.3-runtime-ubuntu24.04"
  package_data: []
env:
  JAX_ENABLE_X64: "true"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.5"
  XLA_FLAGS: "--xla_gpu_autotune_level=0 --xla_gpu_enable_cublaslt=false"
metadata:
  mosaic:
    name: "PhiFlow"
    backend: jax
    family: projection
    scheme: "semi-Lagrangian + projection"
    discretization: FD
    numerics: "Semi-Lagrangian, explicit diffusion (four substeps)"
    ad_strategy: hybrid
    differentiable: true
    uses_gpu: true
    internal_dtype: float64
    doc_url: "https://tum-pbs.github.io/PhiFlow/"
