name: openfoam_navier_stokes_grid
version: "0.1.0"
description: >
  OpenFOAM icoFoam PISO solver run as a forward-only reference baseline (C++ subprocess). No
  reverse-mode AD; used to anchor cross-solver comparisons.
build_config:
  package_data: []

  extra_packages:
    - wget
    - software-properties-common

  base_image: "ubuntu:24.04"
  target_platform: "linux/x86_64"

  custom_build_steps:
    - USER root
    - |
      RUN sh -c "wget -O - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc" && \
          add-apt-repository http://dl.openfoam.org/ubuntu && \
          apt-get update && \
          apt-get install -y --no-install-recommends openfoam12 && \
          rm -rf /var/lib/apt/lists/*

metadata:
  mosaic:
    name: "OpenFOAM"
    backend: cpp
    family: projection
    scheme: "icoFoam PISO"
    discretization: FV
    numerics: "PISO/PIMPLE, Euler"
    ad_strategy: null
    differentiable: false
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://www.openfoam.com/documentation/overview"
    # What it took to run OpenFOAM here, beyond case files as in its
    # tutorials. The periodic boxes start from the legacy icoFoam cavity
    # tutorial and the channel from incompressibleFluid/offsetCylinder.
    # Settings other OpenFOAM-12 tutorials use count as ordinary use; recorded
    # are values no tutorial uses, settings a case needs beyond its starting
    # tutorial, and departures from it picked by measurement.
    # Format: mosaic/benchmarks/core/interventions.py.
    abstraction: application
    interventions:
      - id: momentum-tolerance
        level: L0
        necessity: required
        tuned: true
        what: >
          The periodic icoFoam case solves the momentum predictor to an
          absolute tolerance of 1e-8 instead of the cavity tutorial's 1e-5.
          The 3-D periodic case uses the same file.
        why:
          ns-2d-periodic:
            consequences: [inaccurate-forward]
            symptom: >
              At 1e-5 the 2-D Taylor-Green error stalls at 2.7e-4 between
              N = 64 and N = 128, which made forward/baseline borderline. At
              1e-8 it reaches 5.9e-5 at N = 128.
            evidence: >
              #222, table of U tolerances from 1e-5 to 1e-9 (merged through
              #232); 3-D results were unchanged.
        provenance: mosaic-team
      - id: periodic-pressure-solver
        level: L0
        necessity: choice
        tuned: true
        what: >
          The periodic boxes solve the pressure with GAMG and the
          DICGaussSeidel smoother instead of the cavity tutorial's PCG with
          DIC, at the tutorial's tolerances (1e-6, relTol 0.05).
        why:
          ns-2d-periodic:
            consequences: [too-slow]
            symptom: >
              With PCG/DIC, spatial_cost at N = 256 takes 37.4 s against
              16.4 s, and temporal_cost at 1000 steps 44.7 s against 27.8 s.
              Every status is unchanged; forward errors move in the fifth
              significant digit.
            evidence: "#306, before/after table."
          ns-3d:
            consequences: []
            symptom: >
              Cost moves by less than 8% either way (spatial_cost at N = 64:
              28.7 s with PCG/DIC against 27.1 s); the 3-D box shares the 2-D
              box's fvSolution.
            evidence: "#306, before/after table."
        provenance: mosaic-team
      - id: periodic-mpi-decomposition
        level: L0
        necessity: choice
        tuned: true
        what: >
          The periodic boxes are decomposed with scotch and run under mpirun,
          one rank per physical core and at least 10,000 cells per rank.
          Smaller cases run serially, as does the channel.
        why:
          ns-2d-periodic:
            consequences: [too-slow]
            symptom: >
              Serial, spatial_cost at N = 256 takes 9.90 s against 6.39 s
              decomposed. Statuses are unchanged. With the CPUs loaded by
              other solvers, decomposed runs were slower than serial ones
              (#306); the measurement assumes CI's cost jobs run alone.
            evidence: "#314, before/after table; #306, notes."
          ns-3d:
            consequences: [too-slow]
            symptom: >
              Serial, spatial_cost at N = 64 takes 25.6 s against 12.9 s
              decomposed, and 100 steps at N = 48 take 18.2 s against 7.24 s.
              At 10 steps decomposing and reconstructing outweigh the solve
              (3.92 s serial against 4.33 s). On a loaded CPU, N = 64 took
              150 to 280 s at 24 ranks against 29 s serial (#306).
            evidence: "#314, before/after table; #306, notes."
        provenance: mosaic-team
      - id: channel-momentum-tolerance
        level: L0
        necessity: choice
        what: >
          The cylinder channel solves the momentum predictor to 1e-8 instead
          of the tutorial's 1e-5.
        why:
          ns-2d-cylinder:
            consequences: []
            symptom: >
              None measured: at 1e-5, forward/cylinder gives the same Cd to
              five digits with no speed-up. drag_opt was not run at 1e-5.
            evidence: "#269, notes."
        provenance: mosaic-team
      - id: channel-non-orthogonal-corrector
        level: L0
        necessity: required
        what: >
          One non-orthogonal corrector (nNonOrthogonalCorrectors 1) on the
          body-fitted O-grid, where the offsetCylinder tutorial uses 0. The
          periodic case uses 0, as its tutorial does.
        why:
          ns-2d-cylinder:
            consequences: [crash]
            symptom: >
              Without it, the run at 20 cells per diameter fails (maximum
              Courant number 11.9).
            evidence: "#269, before/after table."
        provenance: mosaic-team
      - id: graded-channel-mesh
        level: L0
        necessity: choice
        tuned: true
        what: >
          The O-grid cells shrink radially to half the size of the box cells
          at the cylinder wall, so the smallest cell is about 0.35 dx, and the
          wake block coarsens to 10 dx at the outlet.
        why:
          ns-2d-cylinder:
            consequences: [too-slow]
            symptom: >
              A uniform mesh takes 111 s for forward/cylinder against 82 s,
              both measured with the tighter pressure tolerance and MPI
              decomposition the channel used before #269. Its Cd (5.567318 and
              5.578718 at 10 and 20 cells per diameter) is closer to the
              reference 5.5795 than the graded mesh's (5.563948 and 5.576608).
            evidence: "#269, before/after table; smallest cell from #263."
        provenance: mosaic-team
    deviations: []
