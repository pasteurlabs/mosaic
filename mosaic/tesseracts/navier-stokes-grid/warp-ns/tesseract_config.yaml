name: warp_ns_navier_stokes_grid
version: "0.1.0"
description: >
  Periodic NVIDIA Warp projection solvers with FFT pressure solves, projected SSPRK3
  and skew-symmetric advection in 2D and 3D. Gradients via wp.Tape kernel-level VJP.
build_config:
  package_data:
    - ["../../../mosaic_shared", "/tmp/mosaic_shared"]
  custom_build_steps:
    - "RUN /python-env/bin/pip install /tmp/mosaic_shared"

metadata:
  mosaic:
    name: "Warp-NS"
    backend: warp
    family: fd
    scheme: "Projected SSPRK3 (2D+3D), periodic FFT Poisson, wp.Tape VJP"
    discretization: FD
    numerics: "Centered skew-symmetric advection and SSPRK3 (2D+3D)"
    ad_strategy: autodiff
    differentiable: true
    uses_gpu: true
    internal_dtype: float32
    doc_url: "https://github.com/NVIDIA/warp"
