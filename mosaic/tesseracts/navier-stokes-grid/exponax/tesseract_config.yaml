name: exponax_navier_stokes_grid
version: "0.1.0"
description: >
  Exponential time-differencing Runge–Kutta (ETDRK) spectral integrator for 2D and 3D
  Navier–Stokes, enforcing incompressibility to machine precision by construction. Gradients
  via JAX source-transformation AD
build_config:
  base_image: "nvidia/cuda:12.6.3-runtime-ubuntu24.04"
  package_data: []
env:
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.95"

metadata:
  mosaic:
    name: "Exponax"
    backend: jax
    family: spectral
    scheme: "spectral ETDRK"
    discretization: Spectral
    numerics: ETDRK2
    ad_strategy: autodiff
    differentiable: true
    uses_gpu: true
    internal_dtype: float32
    doc_url: "https://fkoehler.site/exponax/"
    # What it took to run Exponax here, beyond expressing the setup with
    # Exponax's steppers. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: vorticity-velocity-conversion
        level: L2
        necessity: required
        what: >
          The 2-D path converts the velocity to Exponax's vorticity variable
          (q = -curl u) with a spectral curl, runs Exponax's vorticity
          stepper, and converts back with a spectral Biot-Savart inversion.
          The mean velocity, which the vorticity form drops, is carried
          separately, under the mean force and drag when there are any.
        why:
          ns-2d-periodic: &vorticity-velocity-conversion-periodic
            consequences: [cannot-express]
            symptom: >
              The benchmark's state is velocity, and Exponax 0.2.0's velocity
              steppers (NavierStokesVelocity, KolmogorovFlowVelocity) accept
              only three spatial dimensions; in 2-D it offers the vorticity
              form only.
            evidence: >
              https://github.com/Ceyron/exponax/blob/v0.2.0/exponax/stepper/_navier_stokes.py
              (num_spatial_dims checks).
          ns-2d-kolmogorov: *vorticity-velocity-conversion-periodic
        provenance: mosaic-team
      - id: canonical-force-injection
        level: L3
        necessity: required
        what: >
          With a body force, the 2-D path sets the injection term inside
          Exponax's KolmogorovFlowVorticity stepper (the private
          _integrator._nonlinear_fun.injection) to the spectral curl of the
          force, as complex coefficients.
        why:
          ns-2d-kolmogorov:
            consequences: [cannot-express]
            symptom: >
              Exponax 0.2.0 builds the injection from injection_mode and
              injection_scale as a real coefficient on one mode, which samples
              sin(κy) at y = j·h. The canonical force is sampled at
              (j + ½)h, so the public options put it half a cell off, a phase
              error of κh/2 or about 20% of the laminar Kolmogorov solution at
              N = 64.
            evidence: >
              https://github.com/Ceyron/exponax/blob/v0.2.0/exponax/nonlin_fun/_vorticity_convection.py
              (the injection term);
              tests/test_ns_grid_forcing.py::test_laminar_kolmogorov_transient;
              #272.
        provenance: mosaic-team
    deviations: []
