name: ins_navier_stokes_grid
version: "0.1.0"
description: >
  Julia staggered finite-volume solver with pressure projection and RK4 time integration,
  on the GPU through its CUDA backend (KernelAbstractions.jl). Periodic boxes use a
  spectral pressure solve; the channel a direct one, with the cylinder as a Brinkman
  penalization. Differentiates through the time loop via Zygote.jl reverse-mode AD.
build_config:
  base_image: "debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3"
  package_data:
    - ["./Project.toml", "/app/julia_env/Project.toml"]
    - ["./Manifest.toml", "/app/julia_env/Manifest.toml"]
    - ["./LocalPreferences.toml", "/app/julia_env/LocalPreferences.toml"]
    - ["./solver.jl", "/tesseract/solver.jl"]
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates gcc g++ && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.3-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    # PackageCompiler.create_sysimage(...) used to bake an AOT system image
    # but added many minutes on CI for this dep tree. The benchmark reuses
    # one container across many calls, so a one-time JIT cost on first call
    # is a net win over paying the sysimage build cost every push. Removed
    # PackageCompiler from the package list — it's no longer imported.
    # Project.toml and Manifest.toml pin IncompressibleNavierStokes 5.0.0,
    # Zygote 0.7.10, CUDA 6.4.2 and everything they depend on, and
    # Pkg.instantiate() installs exactly that Manifest. LocalPreferences.toml
    # holds two CUDA.jl settings:
    # - The build has no GPU, so CUDA.jl cannot pick its toolkit from the
    #   driver. The runtime and compiler are fixed at 12.6, and Pkg downloads
    #   them.
    # - CUDA.jl waits for the GPU on Julia threads it adopts by default. Julia
    #   stops threads for GC through signals that juliacall leaves unhandled,
    #   so the server segfaults once a GC meets such a wait; blocking
    #   synchronization keeps the waits on the calling thread.
    # Without a GPU, one precompile worker dumps a core even though
    # precompilation succeeds; ulimit keeps it out of the image.
    #
    # Then warm up juliacall's Julia environment, as root, mirroring the init
    # that tesseract_api.py does at import time — then chmod in the same layer.
    # The first `import juliacall` is what resolves the environment: juliapkg
    # adds PythonCall to /app/julia_env, precompiles it into /app/julia_depot,
    # and guards the whole thing with a lock file at /app/julia_env/lock.pid
    # (mode 644). Left to itself that first import is Tesseract's own
    # `tesseract-runtime check`, which the generated Dockerfile runs as uid
    # 9999 *after* all custom build steps — so the lock file and ~700 depot
    # entries end up owned by 9999, out of reach of the chmod. `tesseract
    # serve` starts the container as the *host* uid, which then cannot open
    # the lock file:
    #   PermissionError: [Errno 13] Permission denied: '/app/julia_env/lock.pid'
    # and every call fails with "Tesseract container ... failed to start".
    # Doing it here leaves nothing under /app owned by 9999, and the build-time
    # check finds the environment resolved (juliapkg skips straight past it).
    # Keep the install, the warm-up and the chmod in one RUN: as separate
    # layers the chmod would copy up every file under /app (~3 GB with CUDA).
    - 'RUN ulimit -c 0 && mkdir -p /app/julia_depot && julia --project=/app/julia_env -e ''using Pkg; Pkg.instantiate(); Pkg.precompile()'' && python -c ''import juliacall; juliacall.Main.seval("using Pkg; Pkg.activate(ENV[\"JULIA_PROJECT\"]); using IncompressibleNavierStokes, Zygote, CUDA")'' && chmod -R 777 /app'
env:
  JULIA_PROJECT: "/app/julia_env"
  PYTHON_JULIAPKG_PROJECT: "/app/julia_env"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"

metadata:
  mosaic:
    name: "INS.jl"
    backend: julia
    family: projection
    scheme: "FV + projection"
    discretization: FV
    numerics: "Projection, RK4"
    ad_strategy: autodiff
    differentiable: true
    uses_gpu: true
    internal_dtype: float32
    doc_url: "https://agdestein.github.io/IncompressibleNavierStokes.jl/dev/"
    # What it took to run INS.jl here, beyond expressing the setup through
    # its API. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: hand-written-rk4-rollout
        level: L2
        necessity: choice
        what: >
          The VJP differentiates a hand-written, non-mutating RK4 loop over
          create_right_hand_side with Zygote.pullback. On periodic boxes apply
          runs the library's in-place solve_unsteady with RKMethods.RK44
          instead, except with a body force, a drag or snapshots, where it runs
          the hand-written loop too, so that with a force both integrate the
          same right-hand side. No comparison with the library's force! hook
          (examples/Kolmogorov2D.jl) is recorded. In the channel apply runs the
          hand-written loop too, with the channel's right-hand side, and records
          the force on the cylinder after every step.
        why:
          ns-2d-periodic: &rollout-reason
            consequences: []
            symptom: >
              Zygote cannot differentiate array mutation, so the VJP needs a
              non-mutating rollout; INS.jl's documented way is a loop over its
              non-mutating timestep. No reason is recorded for writing RK4 by
              hand instead. Keeping the in-place stepper for apply was faster
              on the CPU, before the move to the GPU (#307): 0.56 s against
              2.49 s for the non-mutating rollout at N = 256, 100 steps. The
              two paths agreed to 2.2e-4 (2-D) and 1.0e-4 (3-D) in float32.
            evidence: >
              https://github.com/agdestein/IncompressibleNavierStokes.jl/blob/v5.0.0/examples/Differentiability.jl;
              #103.
          ns-2d-kolmogorov: *rollout-reason
          ns-3d: *rollout-reason
          ns-2d-cylinder:
            consequences: []
            symptom: >
              The VJP needs the non-mutating rollout for the same reason as on
              the periodic boxes. apply shares it, so the drag gradient check
              compares the VJP with exactly the rollout it differentiates, and
              the per-step force comes from the same loop. solve_unsteady was
              not tried for the channel's apply.
            evidence: >
              tests/test_ins_jl_cylinder.py::test_drag_gradient_matches_fd.
        provenance: mosaic-team
      - id: brinkman-cylinder
        level: L2
        necessity: required
        what: >
          Represents the cylinder as a Brinkman penalization force −χu/η in
          the momentum right-hand side, with χ = 1 on every face touching a
          cell of the shared staircase (solid_cells) and η = dt. The force on
          the cylinder is the penalization's integral, the sum of χu/η Δx²
          over the faces, after every step.
        why:
          ns-2d-cylinder:
            consequences: [cannot-express]
            symptom: >
              INS.jl 5.0.0 has no obstacles or immersed boundaries. Its
              documented hook for extra momentum terms is a body force
              (examples/Actuator2D.jl), and the penalization is one. The force
              is integrated explicitly: at η = dt / 2.5 a run at 20 cells per
              diameter went non-finite. Halving η from dt moved Cd by 0.1% at
              10 cells per diameter.
            evidence: "#325, notes."
        provenance: mosaic-team
      - id: differentiable-inlet
        level: L2
        necessity: required
        what: >
          Gives the channel a no-slip DirichletBC at the inlet and adds the
          inflow profile to the inlet faces of the state after INS.jl applies
          the boundary conditions, in every right-hand side.
        why:
          ns-2d-cylinder:
            consequences: [no-gradient]
            symptom: >
              INS.jl's rrule for apply_bc_u returns no tangent for the setup,
              which holds a DirichletBC's value, and building a Setup inside
              Zygote.pullback fails with "Mutating arrays is not supported --
              called push!". The inflow profile, which drag_opt optimizes,
              would get no gradient. Added after the BCs, the drag gradient
              matched a central difference to 1e-5 (prototype, 40 steps at 10
              cells per diameter) and 3e-5 over drag_opt's horizon.
            evidence: >
              src/boundary_conditions.jl of IncompressibleNavierStokes.jl
              v5.0.0 (the rrule of apply_bc_u);
              tests/test_ins_jl_cylinder.py::test_drag_gradient_matches_fd.
        provenance: mosaic-team
      - id: separable-pressure-solver
        level: L2
        necessity: required
        what: >
          Solves the channel's pressure Poisson equation by diagonalizing
          INS.jl's Laplacian, which on the uniform grid is the Kronecker sum
          of an x and a y operator read off laplacian_mat(setup), instead of
          with the psolver_direct that default_psolver picks. The transforms
          run in Float64.
        why:
          ns-2d-cylinder:
            consequences: [crash, too-slow]
            symptom: >
              On CuArrays psolver_direct needs INS.jl's CUDSS extension, which
              imports CUDSS.CUDA. CUDSS 0.7 and later, the only versions
              compatible with CUDA.jl 6, no longer define it, so the extension
              fails to load, Pkg.precompile() exits 1 and psolver_direct
              raises "Unsupported array type". psolver_transform asserts that
              every boundary is periodic or Dirichlet, which the PressureBC
              outlet is not. psolver_cg on the GPU was stopped after 600 s at
              10 cells per diameter, where this solver's run takes 2.7 s.
            evidence: >
              ext/CUDSSExt.jl and src/pressure.jl of
              IncompressibleNavierStokes.jl v5.0.0; CUDSS.jl's registry compat
              (CUDSS 0.7 and later require CUDACore 6); #325, notes.
        upstream: >
          Not reported. INS.jl's ext/CUDSSExt.jl would need to import CUDA
          (or CUDACore) directly instead of through CUDSS.
        provenance: mosaic-team
      - id: float32-setup
        level: L0
        necessity: choice
        what: >
          Builds the Setup from Float32 grid vectors and keeps literals
          eltype-preserving, so the solve and its pullback run in float32.
        why:
          ns-2d-periodic: &float32-reason
            consequences: []
            symptom: >
              With Float64 grid vectors the state and the Zygote tape were
              promoted to Float64 after the first projection, so INS.jl paid
              Float64 cost with float32 inputs and outputs. Float32 matches
              the other float32 solvers; #103 offered keeping Float64 and
              disclosing it instead. No cost factor was measured separately,
              on the CPU or on the GPU.
            evidence: >
              #103, item 3; INS.jl's manual on floating point precision
              (docs/src/manual/backends.md at v5.0.0).
          ns-2d-kolmogorov: *float32-reason
          ns-3d: *float32-reason
          ns-2d-cylinder: *float32-reason
        provenance: maintainer-authored
      - id: cuda-backend
        level: L0
        necessity: choice
        tuned: true
        what: >
          With a GPU present, builds the Setup with backend = CUDABackend()
          and moves the initial state to the device, so the solve and its
          Zygote pullback run on INS.jl's CUDA backend instead of the default
          CPU backend.
        why:
          ns-2d-periodic: &cuda-backend-periodic
            consequences: [too-slow]
            symptom: >
              On the CPU, vjp_cost at N = 256 took 9.20 s against 0.96 to
              2.59 s on a shared A100. Small cases got slower: spatial_cost at
              N = 64 went from 0.085 s to 0.16 to 0.64 s. Every status and
              forward error is unchanged.
            evidence: "#307, notes."
          ns-2d-kolmogorov: *cuda-backend-periodic
          ns-3d:
            consequences: [too-slow]
            symptom: >
              On the CPU, vjp_cost at N = 64 took 54.6 s against 1.58 to
              3.72 s, and 100 steps 47.2 s against 2.38 to 3.15 s. The
              5120-step horizon_sweep_limits VJP needs 28.3 GB on the device
              and runs out of memory on the T4.
            evidence: "#307, notes."
          ns-2d-cylinder:
            consequences: []
            symptom: >
              With one Julia thread on the CPU, a forward run to t = 8 took
              3.4 s at 10 cells per diameter and 25.5 s at 20, against 2.7 s
              and 5.4 s on an A100. drag_opt's VJP (10 cells per diameter,
              t = 4) took 8.2 s against 3.9 s. Warm calls; the A100 was not
              shared.
            evidence: "#325, notes."
        provenance: mosaic-team
      - id: julia-cpu-target-generic
        level: L0
        necessity: unknown
        what: >
          The image sets JULIA_CPU_TARGET=generic, so the package images Julia
          precompiles at build time target a generic x86-64 CPU rather than
          the build machine's. Code compiled at run time is unaffected.
        why:
          ns-2d-periodic: &target-reason
            consequences: []
            symptom: >
              No reason recorded; present since the initial commit. Julia's
              docs recommend it where images run on CPUs other than the one
              that built them. The solver's kernels run on the GPU (#307) and
              are compiled at run time, so only host-side code from the package
              images could be slower; not measured.
          ns-2d-kolmogorov: *target-reason
          ns-3d: *target-reason
          ns-2d-cylinder: *target-reason
        provenance: mosaic-team
    deviations: []
