name: dealii_heat_thermal_mesh
version: "0.1.0"
description: >
  deal.II Q1 trilinear hexahedral FEM heat-conduction solver with SIMP conductivity (C++
  subprocess, AMG-preconditioned CG). Forward-only — reference implementation for
  cross-framework validation.
build_config:
  base_image: "dealii/dealii:v9.7.1-jammy"
  extra_packages:
    - nlohmann-json3-dev
  package_data:
    - ["../../../mosaic_shared", "/tmp/mosaic_shared"]
    - ["./src", "/opt/dealii_heat/src"]
    - ["./CMakeLists.txt", "/opt/dealii_heat/CMakeLists.txt"]
  custom_build_steps:
    - "RUN pip install /tmp/mosaic_shared"
    - "RUN cd /opt/dealii_heat && cmake -B build -DCMAKE_BUILD_TYPE=Release . && cmake --build build -j4"

metadata:
  mosaic:
    name: "deal.II"
    backend: cpp
    family: fem
    scheme: "FEM Q1 heat conduction (SIMP, forward-only)"
    discretization: FE
    numerics: "CG+AMG"
    ad_strategy: null
    differentiable: false
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://www.dealii.org/"
    # What it took to run deal.II here, beyond writing the assembly loop the
    # library is designed for. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: amg-preconditioner
        title: Preconditions the CG solve with algebraic multigrid
        level: L0
        necessity: choice
        tuned: true
        what: >
          Preconditions the CG solve with Trilinos ML algebraic multigrid
          (PreconditionAMG, elliptic) instead of the SSOR of the step-5
          tutorial the assembly follows.
        why:
          heat:
            consequences: [too-slow]
            symptom: >
              With the tutorial's SSOR preconditioner the largest mesh solves
              about 2.4 times slower (61.1 s against 25.6 s), with the same
              forward results.
            notes: >
              The times are spatial_cost at nx = 1024, where UMFPACK takes
              35.6 s. Every forward metric is the same with SSOR. AMG is faster
              from nx = 256 on. At nx = 16 its setup makes it slower, 0.020 s
              against 0.014 s.
            evidence: "#305, notes table."
        provenance: mosaic-team
      - id: cg-tolerance
        title: Loosens the CG stopping tolerance to 1e-8
        level: L0
        necessity: choice
        tuned: true
        what: >
          The CG solve stops at a residual of 1e-8 times the right-hand-side
          norm, with a cap of 50000 iterations.
        why:
          heat:
            consequences: [too-slow]
            symptom: >
              At the earlier tolerance of 1e-12 the largest mesh solves more
              slowly (60.1 s against 51.1 s), with identical forward metrics.
            notes: >
              The times are spatial_cost at nx = 1024, measured with SSOR.
              With AMG, #305 checked only that the forward metrics are
              unchanged at 1e-8.
            evidence: "#266, before/after table; #305, notes."
        provenance: mosaic-team
    deviations: []
