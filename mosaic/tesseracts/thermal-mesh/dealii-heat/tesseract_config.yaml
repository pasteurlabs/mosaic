name: dealii_heat_thermal_mesh
version: "0.1.0"
description: >
  deal.II Q1 trilinear hexahedral FEM heat-conduction solver with SIMP conductivity (C++
  subprocess, SSOR-preconditioned CG). Forward-only — reference implementation for
  cross-framework validation.
build_config:
  base_image: "dealii/dealii:v9.7.1-jammy"
  extra_packages:
    - nlohmann-json3-dev
  package_data:
    - ["../../../mosaic_shared", "/tmp/mosaic_shared"]
    - ["./src", "/opt/dealii_heat/src"]
    - ["./CMakeLists.txt", "/opt/dealii_heat/CMakeLists.txt"]
  custom_build_steps:
    - "RUN pip install /tmp/mosaic_shared"
    - "RUN cd /opt/dealii_heat && cmake -B build -DCMAKE_BUILD_TYPE=Release . && cmake --build build -j4"

metadata:
  mosaic:
    name: "deal.II"
    backend: cpp
    family: fem
    scheme: "FEM Q1 heat conduction (SIMP, forward-only)"
    discretization: FE
    numerics: "CG+SSOR"
    ad_strategy: null
    differentiable: false
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://www.dealii.org/"
    # What it took to run deal.II here, beyond writing the assembly loop the
    # library is designed for. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: cg-tolerance
        level: L0
        necessity: choice
        tuned: true
        what: >
          The SSOR-preconditioned CG solve (omega = 1.2, as in the step-5 tutorial)
          stops at a residual of 1e-8 times the right-hand-side norm, with a
          cap of 50000 iterations.
        why:
          heat:
            consequences: [too-slow]
            symptom: >
              At the earlier 1e-12 every forward metric is identical and the
              largest mesh is slower: spatial_cost at nx = 1024 took 60.1 s
              against 51.1 s.
            evidence: "#266, before/after table."
        provenance: mosaic-team
    deviations: []
