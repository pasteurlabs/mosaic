name: dealii_heat_thermal_mesh
version: "0.1.0"
description: >
  deal.II Q1 trilinear hexahedral FEM heat-conduction solver with SIMP conductivity (C++
  subprocess, SSOR-preconditioned CG). Forward-only — reference implementation for
  cross-framework validation.
build_config:
  base_image: "dealii/dealii:v9.7.1-jammy"
  extra_packages:
    - nlohmann-json3-dev
  package_data:
    - ["../../../mosaic_shared", "/tmp/mosaic_shared"]
    - ["./src", "/opt/dealii_heat/src"]
    - ["./CMakeLists.txt", "/opt/dealii_heat/CMakeLists.txt"]
  custom_build_steps:
    - "RUN pip install /tmp/mosaic_shared"
    - "RUN cd /opt/dealii_heat && cmake -B build -DCMAKE_BUILD_TYPE=Release . && cmake --build build -j4"

metadata:
  mosaic:
    name: "deal.II"
    backend: cpp
    family: fem
    scheme: "FEM Q1 heat conduction (SIMP, forward-only)"
    discretization: FE
    numerics: "CG+SSOR"
    ad_strategy: null
    differentiable: false
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://www.dealii.org/"
    interventions:
      - id: cg-ssor-tight-tolerance
        level: L0
        scope: [slab]
        what: >
          Conjugate gradients with SSOR(omega=1.2) preconditioning, stopped at a
          residual of 1e-12 times the right-hand-side norm with a cap of 50000
          iterations.
        why:
          consequence: inaccurate-forward
          symptom: >
            Not demonstrated. Presumably the tight tolerance keeps the
            forward-only reference, which produces the target temperatures for
            conductivity recovery, free of solver error; no run with a looser
            tolerance exists.
          evidence: none found (present since the initial commit c47498a, no rationale recorded).
          confidence: inferred
        upstream: null
        provenance: mosaic-team
        classification_notes: >
          deal.II has no default linear solver. CG with SSOR(1.2) is the
          tutorial pattern (step-5 uses the same preconditioner with an
          absolute tolerance of 1e-12); only the relative tolerance and the
          iteration cap differ. Arguably plain documented use and not an
          intervention.
