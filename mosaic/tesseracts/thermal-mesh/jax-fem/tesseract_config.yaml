name: jax_fem_thermal_mesh
version: "0.1.0"
description: >
  JAX-FEM HEX8 steady-state heat-conduction solver with SIMP conductivity and optional
  volumetric source. Gradients ∂C/∂ρ and ∂C/∂source via JAX autodiff through the linear FE
  solve (hybrid implicit-function-theorem adjoint)
build_config:
  target_platform: "native"
  base_image: "condaforge/miniforge3:26.1.1-3"
  requirements:
    provider: conda
  package_data:
    - ["../../../mosaic_shared", "/tmp/mosaic_shared"]
  custom_build_steps:
    - "RUN /python-env/bin/pip install /tmp/mosaic_shared"

metadata:
  mosaic:
    name: "JAX-FEM"
    backend: jax
    family: fem
    scheme: "FEM HEX8 heat conduction (SIMP, adjoint AD)"
    discretization: FE
    numerics: "BiCGSTAB+Jacobi"
    ad_strategy: hybrid
    differentiable: true
    uses_gpu: true
    internal_dtype: float64
    doc_url: "https://github.com/deepmodeling/jax-fem"
    # What it took to run JAX-FEM here, beyond expressing the setup as a
    # JAX-FEM Problem. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: jitted-bicgstab-solver
        level: L2
        necessity: choice
        what: >
          Passes JAX-FEM's own Jacobi-preconditioned BiCGSTAB (the default
          jax_solver's algorithm and tolerances), compiled once per matrix
          size, to ad_wrapper through the custom_solver option for the forward
          and adjoint solves.
        why:
          heat:
            consequences: [too-slow]
            symptom: >
              The default jax_solver runs bicgstab eagerly, so it compiles 2
              XLA programs per forward call and 4 per VJP, a fixed overhead on
              every call. The umfpack_solver option used before gives
              identical outputs but is much slower on large meshes. At N =
              1024, spatial_cost took 60.8 s with umfpack_solver and 5.17 s
              with this solver, vjp_cost/by_N 120 s and 10.8 s.
            evidence: "#286, before/after table; comment above _bicgstab."
        provenance: mosaic-team
    deviations: []
