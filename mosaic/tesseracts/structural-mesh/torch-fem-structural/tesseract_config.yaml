name: torch_fem_structural_mesh
version: "0.1.0"
description: >
  torch-fem Solid HEX8 linear-elasticity solver with SIMP stiffness E(ρ) = E_min +
  (E_max − E_min)·ρ^p — the PyTorch backend in structural-mesh. Gradient ∂C/∂ρ via
  PyTorch autograd through the FE solve (implicit-function-theorem adjoint); GPU-native.
build_config:
  package_data: []
  # No CUDA base image needed: the cu121 torch wheel installs its own CUDA
  # runtime via nvidia-* pip packages. The GPU driver is injected at runtime
  # by nvidia-container-toolkit on the host.
  #
  # NOTE: LD_LIBRARY_PATH uses ${LD_LIBRARY_PATH} for Docker variable expansion
  # to append to any existing value; this works because the env: section renders
  # as Dockerfile ENV lines which support variable substitution.
env:
  TORCH_CUDA_ARCH_LIST: "7.0;7.5;8.0;8.6;9.0"
  LD_LIBRARY_PATH: "/python-env/lib/python3.11/site-packages/torch/lib:${LD_LIBRARY_PATH}"

metadata:
  mosaic:
    name: "torch-fem"
    backend: pytorch
    family: fem
    scheme: "FEM HEX8 linear elasticity (SIMP, PyTorch autograd adjoint)"
    discretization: FE
    numerics: "CG+Jacobi"
    ad_strategy: hybrid
    differentiable: true
    uses_gpu: true
    internal_dtype: float64
    doc_url: "https://github.com/meyer-nils/torch-fem"
    # What it took to run torch-fem here, beyond expressing the setup with
    # torch-fem's model API. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: gpu-device
        title: Runs the solver on the GPU
        level: L0
        necessity: choice
        what: >
          With a GPU present, runs torch-fem on it instead of torch's default
          CPU device.
        why:
          structural:
            consequences: []
            symptom: >
              No comparison with the CPU exists.
            notes: >
              The tesseract has run on the GPU since its first version.
        provenance: maintainer-authored
      - id: global-default-device
        title: Sets torch's default device and dtype globally
        level: L0
        necessity: required
        what: >
          Sets torch's default device and dtype (float64) process-wide, so
          the tensors torch-fem allocates internally land on the GPU with the
          mesh, material and load tensors.
        why:
          structural:
            consequences: [crash]
            symptom: >
              torch-fem allocates auxiliary tensors without device=, so they
              land on the CPU and collide with the CUDA tensors.
            notes: >
              No error log is recorded.
            evidence: >
              Code comment; torch-fem's benchmarks/utils.py at v0.12.1 and its
              current installation docs set the default device the same way.
        provenance: maintainer-authored
      - id: gpu-cg-jacobi
        title: Solves with Jacobi-preconditioned CG on the GPU
        level: L0
        necessity: choice
        what: >
          On the GPU, passes method="cg" and preconditioner="jacobi" to
          model.solve for the forward and adjoint solves. On the CPU torch-fem
          chooses.
        why:
          structural:
            consequences: [too-slow]
            symptom: >
              torch-fem 0.12.1 solves systems below 10,000 DOFs directly with
              SciPy on the CPU, even when the matrix is on the GPU.
            notes: >
              Larger systems already get CG with Jacobi without AmgX, so the
              setting keeps the smaller meshes on the device. There is no
              isolated measurement.
            evidence: >
              #188; resolve_method and resolve_library in torch-fem v0.12.1
              src/torchfem/sparse.py.
        provenance: maintainer-authored
      - id: cg-tolerance
        title: Loosens the CG stopping tolerance to 1e-6
        level: L0
        necessity: choice
        tuned: true
        what: >
          The GPU CG stops at a relative residual of 1e-6 (stol) instead of
          torch-fem's 1e-10.
        why:
          structural:
            consequences: [too-slow]
            symptom: >
              At torch-fem's default of 1e-10, spatial_cost at N = 128 took
              0.435 s against 0.338 s, with every status unchanged.
            notes: >
              vjp_cost took 0.717 s against 0.530 s. Measured on a shared GPU.
              Every status is unchanged from 1e-12 to 1e-6. Forward metrics
              are bit-identical and gradient checks move by less than 1e-9.
            evidence: "#301, notes."
        provenance: mosaic-team
      - id: deterministic-kernels
        title: Makes the CUDA assembly deterministic
        level: L0
        necessity: choice
        what: >
          Enables torch.use_deterministic_algorithms(True, warn_only=True), so
          torch-fem's CUDA scatter-adds in assembly sum in a fixed order.
        why:
          structural:
            consequences: []
            symptom: >
              Run-to-run differences were shown on the heat setup only.
            notes: >
              On this setup the setting is kept for consistency, with no
              measurable cost.
            evidence: "#200, notes."
        provenance: maintainer-authored
    deviations: []
