name: torch_fem_structural_mesh
version: "0.1.0"
description: >
  torch-fem Solid HEX8 linear-elasticity solver with SIMP stiffness E(ρ) = E_min +
  (E_max − E_min)·ρ^p — the PyTorch backend in structural-mesh. Gradient ∂C/∂ρ via
  PyTorch autograd through the FE solve (implicit-function-theorem adjoint); GPU-native.
build_config:
  package_data: []
  # No CUDA base image needed: the cu121 torch wheel installs its own CUDA
  # runtime via nvidia-* pip packages. The GPU driver is injected at runtime
  # by nvidia-container-toolkit on the host.
  #
  # NOTE: LD_LIBRARY_PATH uses ${LD_LIBRARY_PATH} for Docker variable expansion
  # to append to any existing value; this works because the env: section renders
  # as Dockerfile ENV lines which support variable substitution.
env:
  TORCH_CUDA_ARCH_LIST: "7.0;7.5;8.0;8.6;9.0"
  LD_LIBRARY_PATH: "/python-env/lib/python3.11/site-packages/torch/lib:${LD_LIBRARY_PATH}"

metadata:
  mosaic:
    name: "torch-fem"
    backend: pytorch
    family: fem
    scheme: "FEM HEX8 linear elasticity (SIMP, PyTorch autograd adjoint)"
    discretization: FE
    numerics: "CG+Jacobi"
    ad_strategy: autodiff
    differentiable: true
    uses_gpu: true
    internal_dtype: float64
    doc_url: "https://github.com/meyer-nils/torch-fem"
