name: firedrake_structural_mesh
version: "0.1.0"
description: >
  Firedrake CG1 FEM linear-elasticity solver with SIMP penalisation. Gradient ∂C/∂ρ via
  firedrake-adjoint (pyadjoint ReducedFunctional) — an independent tape-based discrete
  adjoint complement to FEniCS.
build_config:
  base_image: "firedrakeproject/firedrake:2026.4.0"
  skip_checks: true
  # Reuse Firedrake (and its deps) pre-installed in the vendor base image via
  # --system-site-packages, instead of manually copying its editable-install
  # .pth/finder files into the tesseract venv (which broke on every version bump).
  # mosaic_shared, meshio and scipy are installed from tesseract_requirements.txt,
  # so no package_data copy or custom pip step is needed.
  inherit_base_image_packages: true

metadata:
  mosaic:
    name: "Firedrake"
    backend: firedrake
    family: fem
    scheme: "FEM CG1 linear elasticity (SIMP, pyadjoint ReducedFunctional)"
    discretization: FE
    numerics: "Direct (MUMPS)"
    ad_strategy: adjoint
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://www.firedrakeproject.org/"
    # What it took to run Firedrake here, beyond expressing the setup in UFL.
    # Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: integer-simp-exponent
        title: Passes an integer-valued SIMP exponent as an integer
        level: L0
        necessity: choice
        what: >
          Uses rho**int(penal) when penal is integer-valued, which it always
          is in the benchmark (3.0), instead of rho**Constant(penal).
        why:
          structural:
            consequences: []
            symptom: >
              UFL estimates a non-integer power, including a Constant
              exponent, as degree(rho) + 2, so every volume form is
              integrated 2 degrees higher than needed (7 instead of 5 on
              hexahedra).
            notes: >
              Not timed in Firedrake. The same change, together with an
              exact quadrature rule, made the FEniCS tesseract 2.25 times
              faster at nx = 128 (see its affine-hex-quadrature record). It
              could be avoided by passing the exponent to the tesseract as an
              integer: that needs the input field declared as int | float
              with default 3, since Pydantic turns an integer input into 3.0
              for the current float field.
        provenance: contributor
    deviations: []
