name: firedrake_structural_mesh
version: "0.1.0"
description: >
  Firedrake CG1 linear elasticity with SIMP penalisation. For homogeneous
  supports, the compliance adjoint is the displacement. Nonzero prescribed
  displacements use the general pyadjoint derivative.
build_config:
  base_image: "firedrakeproject/firedrake:2026.4.0"
  skip_checks: true
  # Reuse Firedrake (and its deps) pre-installed in the vendor base image via
  # --system-site-packages, instead of manually copying its editable-install
  # .pth/finder files into the tesseract venv (which broke on every version bump).
  # mosaic_shared, meshio and scipy are installed from tesseract_requirements.txt,
  # so no package_data copy or custom pip step is needed.
  inherit_base_image_packages: true

metadata:
  mosaic:
    name: "Firedrake"
    backend: firedrake
    family: fem
    scheme: "FEM CG1 linear elasticity (SIMP, pyadjoint ReducedFunctional)"
    discretization: FE
    numerics: "Direct (MUMPS)"
    ad_strategy: adjoint
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://www.firedrakeproject.org/"
    # What it took to run Firedrake here, beyond expressing the setup in UFL.
    # Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: self-adjoint-compliance
        title: Reuses the displacement as the compliance adjoint
        level: L2
        necessity: choice
        what: >
          Assemble the DG0 compliance sensitivity from the displacement when
          all prescribed displacements are zero. Each VJP solves the forward
          problem at its own input density.
        why:
          structural:
            consequences: [too-slow]
            symptom: The general adjoint solves for the same displacement a second time.
            evidence: PETSc KSPSolve counts in the structural Firedrake regression test.
        provenance: contributor
    deviations: []
