name: topopt_jl_structural_grid
version: "0.1.0"
description: >
  TopOpt.jl HEX8 FEM linear-elasticity solver with SIMP penalisation, Julia + Ferrite.jl
  backend. Gradient ∂C/∂ρ via analytical SIMP adjoint sensitivity computed alongside the
  forward solve.
build_config:
  # juliacall keeps Julia's OpenSSL no newer than Python's. TopOpt.jl 0.14 needs
  # Julia 1.12, which ships OpenSSL 3.5; bookworm's Python has 3.0, trixie's 3.5.
  base_image: "debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4"
  package_data:
    - ["./Project.toml", "/app/julia_env/Project.toml"]
    - ["./Manifest.toml", "/app/julia_env/Manifest.toml"]
    - ["./solver.jl", "/tesseract/solver.jl"]
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates libpython3.13 gcc g++ && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.5-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    # PackageCompiler.create_sysimage(...) used to bake an AOT system image
    # but was 30-60 min on CI for this dep tree. The benchmark reuses one
    # container across many calls, so a one-time JIT cost on first call is a
    # net win over paying the sysimage build cost every push. Removed
    # PackageCompiler from the package list — it's no longer imported.
    # Project.toml and Manifest.toml pin TopOpt 0.14.0, Zygote 0.7.10,
    # PythonCall 0.9.31 and everything they depend on, and Pkg.instantiate()
    # installs exactly that Manifest.
    - 'RUN mkdir -p /app/julia_depot && JULIA_PYTHONCALL_LIB=$(find /usr/lib -name ''libpython3*.so.1.0'' 2>/dev/null | head -1) && echo "Using JULIA_PYTHONCALL_LIB=$JULIA_PYTHONCALL_LIB" && JULIA_PYTHONCALL_LIB=$JULIA_PYTHONCALL_LIB julia --project=/app/julia_env -e ''using Pkg; Pkg.instantiate(); Pkg.precompile()'''
    # Warm up juliacall's Julia environment here, as root, mirroring the init
    # that tesseract_api.py does at import time — then chmod in the same layer.
    # The first `import juliacall` is what resolves the environment: juliapkg
    # takes a lock file at /app/julia_env/lock.pid (mode 644) and precompiles
    # the PythonCall extensions into /app/julia_depot. Left to itself that
    # first import is Tesseract's own `tesseract-runtime check`, which the
    # generated Dockerfile runs as uid 9999 *after* all custom build steps —
    # so the lock file and ~200 depot entries end up owned by 9999, out of
    # reach of the chmod. `tesseract serve` starts the container as the *host*
    # uid, which then cannot open the lock file:
    #   PermissionError: [Errno 13] Permission denied: '/app/julia_env/lock.pid'
    # and every call fails with "Tesseract container ... failed to start".
    # Doing it here leaves nothing under /app owned by 9999, and the build-time
    # check finds the environment resolved (juliapkg skips straight past it).
    # Keep the chmod in this same RUN: as a separate layer it would copy up
    # every file this step just created.
    - 'RUN JULIA_PYTHONCALL_LIB=$(find /usr/lib -name ''libpython3*.so.1.0'' 2>/dev/null | head -1) python -c ''import juliacall; juliacall.Main.seval("using Pkg; Pkg.activate(ENV[\"JULIA_PROJECT\"]); using TopOpt, Printf")'' && chmod -R 777 /app'
env:
  # Julia 1.12 adds an interactive thread by default. juliacall leaves Julia's
  # signal handling off, and multithreaded Julia stops threads for GC through
  # signals, so the server segfaulted on the larger meshes; one thread avoids it.
  JULIA_NUM_THREADS: "1,0"
  JULIA_PROJECT: "/app/julia_env"
  PYTHON_JULIAPKG_PROJECT: "/app/julia_env"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"

metadata:
  mosaic:
    name: "TopOpt.jl"
    backend: julia
    family: fem
    scheme: "FEM HEX8 linear elasticity (SIMP, analytical adjoint)"
    discretization: FE
    numerics: "Direct (CHOLMOD)"
    ad_strategy: adjoint
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://github.com/JuliaTopOpt/TopOpt.jl"
    # What it took to run TopOpt.jl here, beyond loading the setup as an INP
    # problem. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: julia-cpu-target-generic
        level: L0
        necessity: unknown
        what: >
          The image sets JULIA_CPU_TARGET=generic, so the package images Julia
          precompiles at build time target a generic x86-64 CPU rather than
          the build machine's. Code compiled at run time is unaffected.
        why:
          structural:
            consequences: []
            symptom: >
              No reason recorded; added in #6 ("ensure all Tesseracts build on
              CI"). Julia's docs recommend it where images run on CPUs other
              than the one that built them. Whether the precompiled solver code
              is slower for it has not been measured.
        provenance: mosaic-team
    deviations:
      - id: nodal-load
        setups: [structural]
        what: >
          The harness gives TopOpt.jl the cantilever load as nodal forces
          (CLOAD) instead of a traction: the shares that integrating the
          traction over the bilinear face elements gives each node.
        consequences: [cannot-express]
        effect: >
          None: on the uniform mesh the nodal forces equal the integrated
          traction.
        evidence: >
          TopOpt.jl 0.14.0's INP reader takes surface loads only as a normal
          pressure (DLOAD P), and the cantilever load is tangential;
          _traction_solvers in mosaic/benchmarks/problems/structural_mesh/physics.py.
