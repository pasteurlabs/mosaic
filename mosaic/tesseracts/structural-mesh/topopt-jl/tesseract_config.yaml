name: topopt_jl_structural_grid
version: "0.1.0"
description: >
  TopOpt.jl HEX8 FEM linear-elasticity solver with SIMP penalisation, Julia + Ferrite.jl
  backend. Gradient ∂C/∂ρ via analytical SIMP adjoint sensitivity computed alongside the
  forward solve.
build_config:
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates libpython3.11 gcc g++ && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.3-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    # PackageCompiler.create_sysimage(...) used to bake an AOT system image
    # but was 30-60 min on CI for this dep tree. The benchmark reuses one
    # container across many calls, so a one-time JIT cost on first call is a
    # net win over paying the sysimage build cost every push. Removed
    # PackageCompiler from the package list — it's no longer imported.
    - 'RUN mkdir -p /app/julia_env /app/julia_depot && JULIA_PYTHONCALL_LIB=$(find /usr/lib -name ''libpython3*.so.1.0'' 2>/dev/null | head -1) && echo "Using JULIA_PYTHONCALL_LIB=$JULIA_PYTHONCALL_LIB" && JULIA_PYTHONCALL_LIB=$JULIA_PYTHONCALL_LIB julia --project=/app/julia_env -e ''using Pkg; Pkg.add([Pkg.PackageSpec(name="TopOpt", version="0.11.0"), Pkg.PackageSpec(name="Nonconvex", version="2.2.0"), Pkg.PackageSpec(name="NonconvexMMA", version="1.1.1"), Pkg.PackageSpec(name="Zygote", version="0.6.77"), Pkg.PackageSpec(name="ChainRulesCore", version="1.26.1"), Pkg.PackageSpec(name="PythonCall", version="0.9.31")]); Pkg.precompile()'''
    # Warm up juliacall's Julia environment here, as root, mirroring the init
    # that tesseract_api.py does at import time — then chmod in the same layer.
    # The first `import juliacall` is what resolves the environment: juliapkg
    # takes a lock file at /app/julia_env/lock.pid (mode 644) and precompiles
    # the PythonCall extensions into /app/julia_depot. Left to itself that
    # first import is Tesseract's own `tesseract-runtime check`, which the
    # generated Dockerfile runs as uid 9999 *after* all custom build steps —
    # so the lock file and ~200 depot entries end up owned by 9999, out of
    # reach of the chmod. `tesseract serve` starts the container as the *host*
    # uid, which then cannot open the lock file:
    #   PermissionError: [Errno 13] Permission denied: '/app/julia_env/lock.pid'
    # and every call fails with "Tesseract container ... failed to start".
    # Doing it here leaves nothing under /app owned by 9999, and the build-time
    # check finds the environment resolved (juliapkg skips straight past it).
    # Keep the chmod in this same RUN: as a separate layer it would copy up
    # every file this step just created.
    - 'RUN JULIA_PYTHONCALL_LIB=$(find /usr/lib -name ''libpython3*.so.1.0'' 2>/dev/null | head -1) python -c ''import juliacall; juliacall.Main.seval("using Pkg; Pkg.activate(ENV[\"JULIA_PROJECT\"]); using TopOpt, Printf")'' && chmod -R 777 /app'
env:
  JULIA_PROJECT: "/app/julia_env"
  PYTHON_JULIAPKG_PROJECT: "/app/julia_env"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"

metadata:
  mosaic:
    name: "TopOpt.jl"
    backend: julia
    family: fem
    scheme: "FEM HEX8 linear elasticity (SIMP, analytical adjoint)"
    discretization: FE
    numerics: "Direct (CHOLMOD)"
    ad_strategy: adjoint
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://github.com/JuliaTopOpt/TopOpt.jl"
    # The solver itself lives in mosaic_shared; changing it re-benchmarks TopOpt.jl.
    shared_sources:
      - mosaic/mosaic_shared/problems/structural_mesh/topopt_solver.jl
    interventions:
      - id: inp-parser-hex-patch
        level: L3
        scope: [cantilever]
        what: >
          Redefines extract_boundary_matrix inside TopOpt.jl's internal
          TopOptProblems.InputOutput.INP.Parser module via Core.eval, with a
          Dict{Any,Bool} face table and plain sorting instead of
          Ferrite.sortface. The replacement copies upstream's use of Base
          internals (Base.ht_keyindex2!, Base._setindex!).
        why:
          consequence: crash
          symptom: >
            Loading the hex (C3D8) mesh through InpStiffness fails: the
            upstream function types its face table as Dict{NTuple{dim,Int},Bool}
            (3-tuples for dim=3), which cannot hold the 4-node faces of a hex,
            and per the code comment Ferrite v0.3.0 has no sortface method for
            4-tuples. No captured error message.
          evidence: >
            Comment at topopt_solver.jl lines 4-14 (initial commit c47498a).
            The Dict{NTuple{dim,Int},Bool} typing is visible in TopOpt.jl
            v0.11.0 src/TopOptProblems/IO/INP/Parser/inp_to_ferrite.jl and is
            unchanged in v0.14.0 and on master. No upstream issue found.
          confidence: stated
        upstream: null
        provenance: mosaic-team
        location:
          [mosaic/mosaic_shared/problems/structural_mesh/topopt_solver.jl]
        classification_notes: >
          Clearly L3: it replaces a function inside a library-internal module.
          It is a workaround for an apparent upstream bug, so rule 2 asks for
          an upstream issue, and none exists. It does not change the
          discretisation (the function only flags boundary faces). An L2 route
          that skips the INP parser, building the Ferrite grid and problem
          directly, may exist but was not explored.
      - id: compliance-grad-field
        level: L1
        scope: [cantilever]
        what: >
          Reads the gradient from the undocumented Compliance.grad field after
          evaluating comp(x), instead of differentiating comp with Zygote as
          TopOpt.jl documents.
        why:
          consequence: null
          symptom: >
            None known. In TopOpt.jl v0.11.0 (src/Functions/compliance.jl) the
            ChainRulesCore rrule for Compliance is itself
            `out = comp(x); out_grad = copy(comp.grad)`, so the documented
            Zygote path would return the same vector. Skipping Zygote may save
            some overhead; this has not been measured.
          evidence: >
            Initial commit c47498a, VJP docstring: "analytical SIMP adjoint
            (comp.grad), no extra linear solve". The rrule needs no extra
            linear solve either.
          confidence: inferred
        upstream: null
        provenance: mosaic-team
        location:
          [mosaic/mosaic_shared/problems/structural_mesh/topopt_solver.jl]
        classification_notes: >
          Reads library internals but changes nothing, and no necessity can be
          shown, so under rule 5 it should be replaced by the documented call
          or removed from the record. topopt_vjp (second marked region) is not
          called from tesseract_api.py. Zygote, ChainRulesCore, Nonconvex and
          NonconvexMMA are installed in the image but not loaded.
      - id: setup-cache
        level: L0
        scope: [cantilever]
        what: >
          Caches the InpStiffness problem, FEASolver and Compliance objects in a
          Dict keyed by a hash of mesh, boundary conditions and material
          parameters, so repeated calls skip writing and parsing the INP file
          and building the solver.
        why:
          consequence: too-slow
          symptom: >
            Not measured. Without it, every apply and VJP call writes, parses
            and deletes an INP file and rebuilds the FE problem before solving.
          evidence: >
            Code comment "to cache the setup" (initial commit c47498a); no
            measurement.
          confidence: inferred
        upstream: null
        provenance: mosaic-team
        location:
          [mosaic/mosaic_shared/problems/structural_mesh/topopt_solver.jl]
        classification_notes: >
          Fits no level well; see the setup-cache entries of the JAX-FEM
          tesseracts. The markers interleave with the problem construction
          inside the if-block, which line-range markers express awkwardly.
