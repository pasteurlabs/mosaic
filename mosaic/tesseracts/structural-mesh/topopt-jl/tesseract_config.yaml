name: topopt_jl_structural_grid
version: "0.1.0"
description: >
  TopOpt.jl HEX8 FEM linear-elasticity solver with SIMP penalisation, Julia + Ferrite.jl
  backend. Gradient ∂C/∂ρ via analytical SIMP adjoint sensitivity computed alongside the
  forward solve.
build_config:
  package_data:
    - ["./solver.jl", "/tesseract/solver.jl"]
  custom_build_steps:
    - "RUN apt-get update -qq && apt-get install -y -q --no-install-recommends wget ca-certificates libpython3.11 gcc g++ && rm -rf /var/lib/apt/lists/*"
    - "RUN wget -q https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.3-linux-x86_64.tar.gz -O /tmp/julia.tar.gz && tar -xzf /tmp/julia.tar.gz -C /usr/local --strip-components=1 && rm /tmp/julia.tar.gz"
    # PackageCompiler.create_sysimage(...) used to bake an AOT system image
    # but was 30-60 min on CI for this dep tree. The benchmark reuses one
    # container across many calls, so a one-time JIT cost on first call is a
    # net win over paying the sysimage build cost every push. Removed
    # PackageCompiler from the package list — it's no longer imported.
    - 'RUN mkdir -p /app/julia_env /app/julia_depot && JULIA_PYTHONCALL_LIB=$(find /usr/lib -name ''libpython3*.so.1.0'' 2>/dev/null | head -1) && echo "Using JULIA_PYTHONCALL_LIB=$JULIA_PYTHONCALL_LIB" && JULIA_PYTHONCALL_LIB=$JULIA_PYTHONCALL_LIB julia --project=/app/julia_env -e ''using Pkg; Pkg.add([Pkg.PackageSpec(name="TopOpt", version="0.11.0"), Pkg.PackageSpec(name="Nonconvex", version="2.2.0"), Pkg.PackageSpec(name="NonconvexMMA", version="1.1.1"), Pkg.PackageSpec(name="Zygote", version="0.6.77"), Pkg.PackageSpec(name="ChainRulesCore", version="1.26.1"), Pkg.PackageSpec(name="PythonCall", version="0.9.31")]); Pkg.precompile()'''
    # Warm up juliacall's Julia environment here, as root, mirroring the init
    # that tesseract_api.py does at import time — then chmod in the same layer.
    # The first `import juliacall` is what resolves the environment: juliapkg
    # takes a lock file at /app/julia_env/lock.pid (mode 644) and precompiles
    # the PythonCall extensions into /app/julia_depot. Left to itself that
    # first import is Tesseract's own `tesseract-runtime check`, which the
    # generated Dockerfile runs as uid 9999 *after* all custom build steps —
    # so the lock file and ~200 depot entries end up owned by 9999, out of
    # reach of the chmod. `tesseract serve` starts the container as the *host*
    # uid, which then cannot open the lock file:
    #   PermissionError: [Errno 13] Permission denied: '/app/julia_env/lock.pid'
    # and every call fails with "Tesseract container ... failed to start".
    # Doing it here leaves nothing under /app owned by 9999, and the build-time
    # check finds the environment resolved (juliapkg skips straight past it).
    # Keep the chmod in this same RUN: as a separate layer it would copy up
    # every file this step just created.
    - 'RUN JULIA_PYTHONCALL_LIB=$(find /usr/lib -name ''libpython3*.so.1.0'' 2>/dev/null | head -1) python -c ''import juliacall; juliacall.Main.seval("using Pkg; Pkg.activate(ENV[\"JULIA_PROJECT\"]); using TopOpt, Printf")'' && chmod -R 777 /app'
env:
  JULIA_PROJECT: "/app/julia_env"
  PYTHON_JULIAPKG_PROJECT: "/app/julia_env"
  JULIA_DEPOT_PATH: "/app/julia_depot"
  JULIA_CPU_TARGET: "generic"
  JULIA_EXECUTABLE: "/usr/local/bin/julia"

metadata:
  mosaic:
    name: "TopOpt.jl"
    backend: julia
    family: fem
    scheme: "FEM HEX8 linear elasticity (SIMP, analytical adjoint)"
    discretization: FE
    numerics: "Direct (CHOLMOD)"
    ad_strategy: adjoint
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://github.com/JuliaTopOpt/TopOpt.jl"
    # What it took to run TopOpt.jl here, beyond loading the setup as an INP
    # problem. Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: inp-parser-hex-patch
        level: L3
        necessity: required
        what: >
          Redefines extract_boundary_matrix inside TopOpt.jl's internal INP
          parser module with Core.eval, with a Dict{Any,Bool} face table and
          plain sorting instead of Ferrite.sortface, so that hexahedral (C3D8)
          meshes load.
        why:
          structural:
            consequences: [crash]
            symptom: >
              With TopOpt.jl 0.11.0 and Ferrite 0.3.0, InpStiffness fails on
              the hex mesh: the face table is typed for 3-tuples, which cannot
              hold the 4-node faces of a hexahedron, and Ferrite.sortface has
              no method for 4-tuples (MethodError).
            evidence: >
              Comment above the patch in solver.jl; reproduced without the
              patch on 2026-10-26 in the intervention cleanup notes, not yet
              published.
        upstream: >
          Not filed: TopOpt.jl 0.14.0 loads hexahedral INP files (re-tested
          in the cleanup notes); #299 moves to it and drops this patch.
        provenance: mosaic-team
      - id: julia-cpu-target-generic
        level: L0
        necessity: unknown
        what: >
          The image sets JULIA_CPU_TARGET=generic, so Julia precompiles for a
          generic x86-64 CPU rather than the build machine's.
        why:
          structural:
            consequences: []
            symptom: >
              No reason recorded. Whether it slows the compiled solver has not
              been measured.
        provenance: mosaic-team
    deviations: []
