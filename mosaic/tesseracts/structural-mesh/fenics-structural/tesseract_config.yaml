name: fenics_structural_mesh
version: "0.1.0"
description: >
  FEniCS/DOLFIN CG1 FEM linear-elasticity solver with SIMP penalisation. Gradient ∂C/∂ρ via
  dolfin-adjoint tape replay (discrete adjoint derived at the variational level via UFL).
build_config:
  base_image: "condaforge/miniforge3:26.1.1-3"
  requirements:
    provider: conda
  package_data:
    - ["../../../mosaic_shared", "/tmp/mosaic_shared"]
  custom_build_steps:
    - "RUN /python-env/bin/pip install /tmp/mosaic_shared"

metadata:
  mosaic:
    name: "FEniCS"
    backend: fenics
    family: fem
    scheme: "FEM CG1 linear elasticity (SIMP, dolfin-adjoint)"
    discretization: FE
    numerics: "Direct (MUMPS)"
    ad_strategy: adjoint
    differentiable: true
    uses_gpu: false
    internal_dtype: float64
    doc_url: "https://fenicsproject.org/"
    # What it took to run FEniCS here, beyond expressing the setup in UFL.
    # Format: mosaic/benchmarks/core/interventions.py.
    abstraction: framework
    interventions:
      - id: mumps-forward-solver
        title: Solves the forward system with MUMPS
        level: L0
        necessity: choice
        tuned: true
        what: >
          Passes solver_parameters={"linear_solver": "mumps"} to the forward
          solve instead of using DOLFIN's default LU backend (UMFPACK).
        why:
          structural:
            consequences: [too-slow]
            symptom: >
              With UMFPACK, apply at nx = 128 is about 1.15 times slower,
              10.1 s against 8.8 s.
            notes: >
              The times are from before and after the change that introduced
              it. Instrumentation put 99.6% of apply in the linear solve, so
              the gain is attributed to the solver switch. No failure without
              it is recorded on this setup.
            evidence: "#182, section 2 (measured together with tape replay)."
        provenance: maintainer-authored
      - id: mumps-adjoint-monkeypatch
        title: Patches dolfin-adjoint to solve the adjoint with MUMPS
        level: L3
        necessity: choice
        what: >
          Replaces dolfin-adjoint's linear solve at import time with one that
          always uses MUMPS. Legacy dolfin-adjoint does not pass the forward
          solver_parameters to the adjoint solve, which then runs UMFPACK.
        why:
          structural:
            consequences: [too-slow]
            symptom: >
              Without the patch the VJP at nx = 128 takes 14.6 s against
              11.1 s, with identical gradients.
            notes: >
              At nx = 64 the VJP takes 4.7 s against 3.2 s. Small meshes show
              no difference. The patched function is
              fenics_adjoint.types.compat.linalg_solve.
            evidence: >
              A/B on an A100, 2026-10-26, in the intervention cleanup notes
              (item 3), not yet published.
        upstream: >
          Not filed: legacy dolfin-adjoint has had no release since 2019.1.0.
          Per #182, newer dolfin-adjoint passes linear_solver to the adjoint
          solve.
        provenance: maintainer-authored
      - id: affine-hex-quadrature
        title: Integrates exactly on parallelepiped hexahedra
        level: L0
        necessity: choice
        what: >
          When every input hexahedron is a parallelepiped, sets
          quadrature_degree 2 (2x2x2 Gauss points) on the volume measure.
          That rule is exact there, since the reference map is affine and the
          Q1 stiffness integrand with a cellwise-constant E has degree at most
          2 per direction. Other meshes keep UFL's estimate.
        why:
          structural:
            consequences: [too-slow]
            symptom: >
              Without it, apply plus VJP at nx = 128 takes 16.8 s against
              7.4 s, 2.25 times as long, with compliance and gradient equal
              to 1e-12.
            notes: >
              UFL treats every hexahedron as a trilinear map and estimates
              degree 7 for this form (4x4x4 Gauss points): 2 for the Q1
              gradients, 3 for det(J) and 2 for the non-integer power of rho.
              On the 48x24x24 corner-load cantilever the gain is 1.42 times
              (47.5 s against 33.5 s), since MUMPS factorisation is a larger
              share there. The adjoint and derivative forms dolfin-adjoint
              derives from the bilinear form inherit the measure's metadata.
            evidence: >
              A/B of this tesseract_api.py against main, called outside the
              container on an i7-7700HQ, one thread, median of 3 iterations,
              2026-11-28; not yet published.
        provenance: maintainer-authored
      - id: integer-simp-exponent
        title: Passes an integer-valued SIMP exponent as an integer
        level: L0
        necessity: choice
        what: >
          Uses rho**int(penal) when penal is integer-valued, which it always
          is in the benchmark (3.0), instead of rho**penal with a float.
        why:
          structural:
            consequences: []
            symptom: >
              UFL estimates a non-integer power as degree(rho) + 2, so every
              volume form is integrated 2 degrees higher than needed.
            notes: >
              Has no effect on the benchmark's box meshes, where
              affine-hex-quadrature fixes the degree. On other meshes it
              lowers UFL's estimate from 7 to 5. Not timed. It could be
              avoided by passing the exponent to the tesseract as an integer:
              that needs the input field declared as int | float with
              default 3, since Pydantic turns an integer input into 3.0 for
              the current float field.
        provenance: maintainer-authored
    deviations: []
