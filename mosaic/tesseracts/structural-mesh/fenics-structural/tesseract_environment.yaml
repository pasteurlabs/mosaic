# Direct dependencies: python, numpy, scipy, meshio, fenics, dolfin-adjoint,
# pip. The other lines pin everything they pulled in, as built for the paper
# release, so that a rebuild gives the same environment. To bump a direct
# dependency, change its line, delete the other pins, rebuild, and pin again
# from the image's /python-env (conda env export). _x86_64-microarch-level is
# left to the solver, because its build names the CPU family the environment
# was solved on.
