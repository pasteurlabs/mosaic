<script type="text/javascript">
// Effort filter for the results pages.
//
// docs/generate_results.py renders a select (.m-effort-select) and wraps every
// table that has an "Effort" column in `::: {.effort-table}`. Choosing a level
// hides the rows of solvers whose effort (the highest level among their
// required interventions) is above it, in every such table on the page.
// "none" and "not recorded" rows are always shown. Without JS every row stays
// visible.

(function () {
  "use strict";

  const RANK = { none: -1, L0: 0, L1: 1, L2: 2, L3: 3 };
  const STORAGE_KEY = "mosaic-effort-max";

  function effortColumn(table) {
    const head = table.tHead && table.tHead.rows[0];
    if (!head) return -1;
    return Array.from(head.cells).findIndex(
      (th) => th.textContent.trim() === "Effort",
    );
  }

  function apply(max) {
    const limit = RANK[max] === undefined ? RANK.L3 : RANK[max];
    document.querySelectorAll(".effort-table table").forEach((table) => {
      const col = effortColumn(table);
      if (col < 0 || !table.tBodies[0]) return;
      Array.from(table.tBodies[0].rows).forEach((row) => {
        const cell = row.cells[col];
        const rank = cell ? RANK[cell.textContent.trim()] : undefined;
        row.hidden = rank !== undefined && rank > limit;
      });
    });
  }

  function init() {
    const selects = document.querySelectorAll(".m-effort-select");
    if (!selects.length) return;
    let saved = null;
    try {
      saved = window.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      saved = null;
    }
    selects.forEach((select) => {
      if (saved && RANK[saved] !== undefined) select.value = saved;
      select.addEventListener("change", () => {
        selects.forEach((other) => (other.value = select.value));
        try {
          window.localStorage.setItem(STORAGE_KEY, select.value);
        } catch (e) {
          // Storage unavailable: the choice lasts for this page view only.
        }
        apply(select.value);
      });
    });
    apply(selects[0].value);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
