<script type="text/javascript">
// Click-to-sort for the results tables: the per-suite tables, rendered inside
// a `::: {.sortable-table}` div (docs/scripts/generate_results.py), and the
// check tables (table.sortable, docs/scripts/scoreboard.py).
//
// Click a header cell to sort by that column, click again to reverse. A cell's
// data-sort attribute, if any, is its sort value (check severity, seconds,
// MiB); otherwise sorting is numeric-aware — cells like "1.74e-08", "0.113 s",
// or "—" are compared by their leading numeric value, everything else
// alphabetically. Each tbody sorts on its own, so the GPU and CPU groups of a
// check table stay apart, and their group header rows (tr.ck-group) stay on
// top. No dependency; if JS is disabled the table stays static in its
// generated order.

(function () {
  "use strict";

  // Parse a cell's sort value. Returns {num} when the text starts with a
  // number (optionally signed / scientific / with a trailing unit), else
  // {str} with the lowercased text. Non-finite placeholders ("—", "n/a")
  // sort to the end regardless of direction.
  function cellValue(text) {
    const t = text.trim();
    if (t === "" || t === "—" || t === "-" || t.toLowerCase() === "n/a") {
      return { num: NaN, str: "" };
    }
    // Leading number: -1.74e-08, 0.113, 12, 1.2e3 ...
    const m = t.match(/^[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/);
    if (m) return { num: parseFloat(m[0]), str: t.toLowerCase() };
    return { num: NaN, str: t.toLowerCase() };
  }

  function compare(a, b, numeric) {
    const av = cellValue(a);
    const bv = cellValue(b);
    if (numeric) {
      const an = isNaN(av.num);
      const bn = isNaN(bv.num);
      // NaN (placeholder) always sorts last.
      if (an && bn) return 0;
      if (an) return 1;
      if (bn) return -1;
      return av.num - bv.num;
    }
    return av.str.localeCompare(bv.str);
  }

  // Decide whether a column is numeric: a majority of its data cells parse
  // as numbers. Keeps text columns (Solver, Converged) alphabetical.
  function sortText(cell) {
    if (!cell) return "";
    return cell.dataset.sort !== undefined ? cell.dataset.sort : cell.textContent;
  }

  function columnIsNumeric(rows, colIdx) {
    let numeric = 0;
    let total = 0;
    for (const row of rows) {
      const cell = row.cells[colIdx];
      if (!cell) continue;
      total += 1;
      if (!isNaN(cellValue(sortText(cell)).num)) numeric += 1;
    }
    return total > 0 && numeric / total >= 0.5;
  }

  function bodyRows(tbody) {
    return Array.from(tbody.rows).filter((r) => !r.classList.contains("ck-group"));
  }

  function makeSortable(table) {
    const thead = table.tHead;
    if (!thead || !thead.rows.length) return;
    const headerCells = Array.from(thead.rows[0].cells);
    const tbodies = Array.from(table.tBodies);
    if (!tbodies.length) return;

    headerCells.forEach((th, colIdx) => {
      th.classList.add("sortable-th");
      th.setAttribute("role", "button");
      th.setAttribute("tabindex", "0");
      let ascending = true;

      function sort() {
        const numeric = columnIsNumeric(tbodies.flatMap(bodyRows), colIdx);
        for (const tbody of tbodies) {
          const rows = bodyRows(tbody);
          rows.sort((r1, r2) => {
            const cmp = compare(sortText(r1.cells[colIdx]), sortText(r2.cells[colIdx]), numeric);
            return ascending ? cmp : -cmp;
          });
          rows.forEach((r) => tbody.appendChild(r));
        }

        // Update sort indicators.
        headerCells.forEach((h) => h.removeAttribute("data-sort"));
        th.setAttribute("data-sort", ascending ? "asc" : "desc");
        ascending = !ascending;
      }

      th.addEventListener("click", sort);
      th.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          sort();
        }
      });
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    document
      .querySelectorAll(".sortable-table table, table.sortable")
      .forEach((table) => makeSortable(table));
  });
})();
</script>
