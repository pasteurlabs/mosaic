name: Cleanup GHCR images

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly, Sunday 03:00 UTC
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete SHA tags older than this many days"
        default: "7"
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete stale SHA tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/cleanup-ghcr-tags.sh
            mosaic/tesseracts/**/tesseract_config.yaml
          sparse-checkout-cone-mode: false

      - name: Cleanup old SHA-tagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          bash .github/scripts/cleanup-ghcr-tags.sh \
            "${{ inputs.max_age_days || '7' }}"
