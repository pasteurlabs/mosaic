# The whole site is rendered everywhere (local `quarto render`/`preview`, PR
# previews in benchmark.yml, and post-merge in publish-results.yml) from the
# single page set and navbar defined here.
project:
  type: website
  output-dir: _site
  pre-render:
    # The results pages (one per setup), the Results overview includes
    # (scoreboard, experiment explorer) and the per-solver scores used by the
    # solver reference are gitignored; regenerate them from mosaic-results/
    # (placeholders when it is absent). Runs first so generate.py can pick up
    # docs/_scores.json.
    - python docs/generate_results.py
    # docs/solvers.qmd is auto-generated from each tesseract_config.yaml's
    # metadata.mosaic block. It's gitignored, so regenerate it on every
    # render/preview to keep navbar links live and the catalog up to date.
    - python docs/generate.py
  # Interactive chart specs, written next to each PNG by the plot harness;
  # fetched at runtime, so Quarto can't discover them from the pages.
  resources:
    - "mosaic-results/**/*.vl.json"
  render:
    - docs/index.qmd
    - docs/results.qmd
    - docs/results_*.qmd
    - docs/solvers.qmd
    - docs/getting-started.qmd
    - docs/standalone.qmd
    - docs/contributing.qmd
    - docs/add-solver.qmd
    - docs/add-domain.qmd
    - docs/architecture.qmd
    - docs/paper.qmd

website:
  title: Mosaic
  repo-url: https://github.com/pasteurlabs/mosaic
  repo-actions: [edit, issue]
  navbar:
    # Results come right after the overview, since most visitors of a
    # benchmark come for them. Then looking up a solver, running the benchmark,
    # using a solver, extending Mosaic, and the paper.
    left:
      - text: Overview
        file: docs/index.qmd
      - text: Results
        menu:
          - text: Overview
            file: docs/results.qmd
          - text: Periodic box (2D)
            file: docs/results_ns_2d_periodic.qmd
          - text: Channel flow past a cylinder (2D)
            file: docs/results_ns_2d_cylinder.qmd
          - text: Forced Kolmogorov flow (2D)
            file: docs/results_ns_2d_kolmogorov.qmd
          - text: Triply periodic box (3D)
            file: docs/results_ns_3d.qmd
          - text: Linear-elastic cantilever
            file: docs/results_structural.qmd
          - text: Steady conduction in a slab
            file: docs/results_heat.qmd
      - text: Solvers
        file: docs/solvers.qmd
      - text: Run the benchmark
        file: docs/getting-started.qmd
      - text: Use a solver in your code
        file: docs/standalone.qmd
      - text: Contribute
        menu:
          - text: Contributing guide
            file: docs/contributing.qmd
          - text: Add a solver
            file: docs/add-solver.qmd
          - text: Add a domain
            file: docs/add-domain.qmd
          - text: Architecture
            file: docs/architecture.qmd
      - text: Paper
        file: docs/paper.qmd
    right:
      - icon: github
        href: https://github.com/pasteurlabs/mosaic
  page-footer:
    center: "[Mosaic](https://github.com/pasteurlabs/mosaic) is built with [Quarto](https://quarto.org)."

execute:
  enabled: false

format:
  html:
    # Warm light/dark themes (docs/theme-*.scss) share docs/styles.scss.
    theme:
      light: [docs/theme-light.scss, docs/styles.scss]
      dark: [docs/theme-dark.scss, docs/styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: github
      dark: nord
    # Render LaTeX math ($...$ inline, $$...$$ display) with MathJax.
    html-math-method: mathjax
    # Enable click-to-zoom for images tagged {.lightbox} (the result plots).
    lightbox: true
    # Click-to-sort for the per-suite results tables (.sortable-table).
    include-after-body:
      - docs/sortable-tables.html
      # Search/filter and detail dialogs.
      - docs/mosaic-ui.html
      # Interactive Vega-Lite charts on the results pages.
      - docs/charts.html
